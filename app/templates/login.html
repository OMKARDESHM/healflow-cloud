{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="rounded-3xl bg-slate-900/80 border border-slate-800 p-6 shadow-xl shadow-slate-900/60">
    <h2 class="text-xl font-semibold text-slate-50 mb-1">Sign in to HealFlow</h2>
    <p class="text-xs text-slate-400 mb-4">
      Use any username/password. First login will create your account.
    </p>
    {% if error %}
      <div class="mb-4 text-xs text-red-300 bg-red-950/40 border border-red-700/40 rounded-xl px-3 py-2">
        {{ error }}
      </div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-300 mb-1">Username</label>
        <input name="username" class="input-field" required />
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Password</label>
        <input type="password" name="password" class="input-field" required />
      </div>
      <button class="w-full mt-2 inline-flex items-center justify-center gap-2 px-4 py-2 rounded-2xl bg-sky-500 text-slate-950 text-sm font-medium hover:bg-sky-400">
        <i class="ph ph-sign-in"></i> Continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
